<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Engineering Template</title>
  <desc id="desc">A cost-aware agent workflow that filters repository context before expensive reasoning and delegates routine work to lower-cost agents.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="reasoning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <circle cx="1070" cy="65" r="120" fill="#2563eb" opacity="0.10"/>
  <circle cx="175" cy="385" r="150" fill="#7c3aed" opacity="0.08"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="78" fill="#f8fafc" font-size="34" font-weight="700">Agentic Engineering Template</text>
    <text x="64" y="112" fill="#94a3b8" font-size="18">Spend expensive reasoning where it matters — not on repository housekeeping.</text>

    <g transform="translate(64,155)">
      <rect width="212" height="98" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="34" cy="31" r="11" fill="#38bdf8"/>
      <text x="56" y="37" fill="#e2e8f0" font-size="18" font-weight="650">Developer request</text>
      <text x="22" y="69" fill="#94a3b8" font-size="14">Normal task description</text>
      <text x="22" y="88" fill="#64748b" font-size="13">No context engineering required</text>
    </g>

    <path d="M284 204 C320 204 328 204 360 204" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(372,145)">
      <rect width="238" height="118" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.7"/>
      <text x="22" y="34" fill="#e0f2fe" font-size="18" font-weight="700">Engineering Router</text>
      <text x="22" y="61" fill="#94a3b8" font-size="14">Classifies the primary need</text>
      <rect x="22" y="78" width="88" height="22" rx="11" fill="#0c4a6e"/>
      <text x="35" y="94" fill="#bae6fd" font-size="12" font-weight="600">route first</text>
      <rect x="118" y="78" width="96" height="22" rx="11" fill="#312e81"/>
      <text x="133" y="94" fill="#c7d2fe" font-size="12" font-weight="600">spend later</text>
    </g>

    <path d="M617 187 C653 160 668 151 701 151" stroke="#7dd3fc" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
    <path d="M617 221 C653 247 668 257 701 257" stroke="#7dd3fc" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(714,114)">
      <rect width="200" height="82" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="20" y="31" fill="#cffafe" font-size="17" font-weight="700">Context Scout</text>
      <text x="20" y="55" fill="#94a3b8" font-size="13">read + search only</text>
      <text x="20" y="72" fill="#67e8f9" font-size="12">minimal task packet</text>
    </g>

    <g transform="translate(714,222)">
      <rect width="200" height="82" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="20" y="31" fill="#d1fae5" font-size="17" font-weight="700">Implementer</text>
      <text x="20" y="55" fill="#94a3b8" font-size="13">routine changes + tests</text>
      <text x="20" y="72" fill="#6ee7b7" font-size="12">lower-cost execution</text>
    </g>

    <path d="M922 155 C956 155 964 155 992 155" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(1004,110)">
      <rect width="142" height="92" rx="20" fill="url(#reasoning)" filter="url(#glow)" opacity="0.96"/>
      <text x="71" y="31" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">High-cost</text>
      <text x="71" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">reasoning model</text>
      <text x="71" y="75" text-anchor="middle" fill="#ddd6fe" font-size="12">Astra today</text>
    </g>

    <path d="M1075 211 C1075 244 1035 263 926 263" stroke="#a78bfa" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(64,334)">
      <rect width="1082" height="48" rx="16" fill="#0b1220" stroke="#1e293b"/>
      <text x="24" y="30" fill="#94a3b8" font-size="14">Raw context</text>
      <rect x="118" y="17" width="236" height="14" rx="7" fill="#334155"/>
      <rect x="118" y="17" width="204" height="14" rx="7" fill="#475569"/>
      <text x="378" y="30" fill="#64748b" font-size="18">→</text>
      <text x="410" y="30" fill="#cbd5e1" font-size="14">filtered context</text>
      <rect x="520" y="17" width="118" height="14" rx="7" fill="url(#accent)"/>
      <text x="663" y="30" fill="#64748b" font-size="18">→</text>
      <text x="695" y="30" fill="#e2e8f0" font-size="14" font-weight="600">focused reasoning</text>
      <text x="843" y="30" fill="#64748b" font-size="18">→</text>
      <text x="875" y="30" fill="#86efac" font-size="14" font-weight="700">less token waste</text>
    </g>

    <rect x="932" y="286" width="214" height="28" rx="14" fill="#052e2b" stroke="#115e59"/>
    <text x="1039" y="305" text-anchor="middle" fill="#99f6e4" font-size="12" font-weight="600">reduce waste, not capability</text>
  </g>
</svg>
